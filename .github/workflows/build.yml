name: Build KasirKuPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable

      - name: Extract project ZIP
        run: |
          unzip -o KasirKuPro-PRO-COMMERCIAL-4.0-MULTI-CABANG.zip -d project
          cp -r project/* .
          cp -r project/.[!.]* . 2>/dev/null || true

      - name: Generate Flutter platform files
        run: |
          flutter create . --platforms=android
          
      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirKuPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
