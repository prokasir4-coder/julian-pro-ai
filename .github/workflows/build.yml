Name: Build JualinPro AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract JualinPro AI ZIP
        run: |
          unzip -o JualinProAI_v1.zip -d project

          # Cari folder yang berisi package.json
          PROJECT_DIR=$(find project -name package.json -type f -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json tidak ditemukan!"
            exit 1
          fi

          echo "Project ditemukan di: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build JualinPro AI APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: eas build --platform android --profile preview --non-interactive

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build JualinPro AI APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: eas build --platform android --profile preview --non-interactive
